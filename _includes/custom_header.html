<style>
.header-wrapper {
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  color: white;

  border-radius: 0.5rem;

  align-items: center;

  object-fit: cover;
  border: 5px solid white;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  flex-shrink: 0;
}

.header-content {
  flex: 1;
}

.header-content h1 {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: white;
}

.header-content .department,
.header-content .affiliation {
  font-size: 1.1rem;
  opacity: 0.95;
  margin-bottom: 0.25rem;
  color: white;
}

.contact-info {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;

  font-size: 0.95rem;
}

.contact-info a {
  color: white;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: opacity 0.2s;
}

.contact-info a:hover {
  opacity: 0.8;
}

@media (max-width: 768px) {
  .header-wrapper {
    flex-direction: column;
    text-align: center;
    padding: 2rem 1rem;
  }

  .profile-photo {
    width: 150px;
    height: 150px;
  }

  .header-content h1 {
    font-size: 2rem;
  }

  .contact-info {
    flex-direction: column;
    gap: 0.75rem;

  }
}

@media print {
  .header-wrapper {
    background: white !important;
    color: black !important;
    box-shadow: none !important;
    border: 2px solid black !important;
  }

  .profile-photo {
    border-color: black !important;
    box-shadow: none !important;
  }

  .header-content h1,
  .header-content .department,
  .header-content .affiliation {
    color: black !important;
  }

  .contact-info a {

  }

</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const headerHTML = document.querySelector('.header-wrapper');
  if (!headerHTML) {
    const header = document.querySelector('header') || document.querySelector('h1');
    if (header) {
      header.insertAdjacentHTML('beforebegin', document.querySelector('.header-wrapper').outerHTML);
    }
  }
});
</script>
