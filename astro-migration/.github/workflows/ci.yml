name: CI/CD - CV Astro

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-migration/package-lock.json'

      - name: Install dependencies
        run: |
          cd astro-migration
          npm ci

      - name: TypeScript check
        run: |
          cd astro-migration
          npm run check

      - name: Lint
        run: |
          cd astro-migration
          npm run lint

  build:
    name: Build All Versions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-migration/package-lock.json'

      - name: Install dependencies
        run: |
          cd astro-migration
          npm ci

      - name: Build all versions
        run: |
          cd astro-migration
          npm run build:all

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-migration/astro-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4