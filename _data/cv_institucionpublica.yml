sections:
  # PERFIL PROFESIONAL
  - title: Perfil Profesional
    entries:
      - title: "Ingeniero de Sistemas | Senior Software Engineer | Software Architect"
        bullets:
          - "Ingeniero de Sistemas con experiencia en desarrollo de software, arquitectura de soluciones y liderazgo técnico en proyectos de transformación digital."
          - "Especializado en desarrollo backend y frontend con Java, Spring Boot, .NET, Angular, TypeScript y Node.js."
          - "Experiencia en diseño e implementación de arquitecturas de microservicios, APIs REST/SOAP, sistemas empresariales e integración de plataformas."
          - "Conocimientos en arquitectura Onion, patrones de diseño, seguridad, autenticación, CI/CD, contenedores y orquestación con Kubernetes."
          - "Experiencia en modernización de sistemas institucionales, automatización de procesos de desarrollo y adopción de herramientas de inteligencia artificial aplicadas a ingeniería de software."
          - "Orientado a la calidad del software, resolución de problemas, mejora continua y aplicación de buenas prácticas de ingeniería."

  # EXPERIENCIA PROFESIONAL
  - title: Experiencia Profesional
    entries:
      - title: "Aduana Nacional"
        sub: "Trayectoria profesional: tres cargos de progresión y crecimiento dentro de la institución"
        location: "Bolivia"
        dates: "Junio 2023 – Octubre 2026"
        bullets:
          - "Supervisor de Desarrollo de Sistemas | [Fecha de inicio] – Octubre 2026"
          - "Responsabilidades: liderazgo y coordinación de equipos de desarrollo, planificación técnica, seguimiento de proyectos, revisión de soluciones y definición de lineamientos de desarrollo."
          - "Profesional en Desarrollo de Sistemas | [Fecha de inicio] – [Fecha de finalización]"
          - "Responsabilidades: desarrollo de soluciones empresariales, implementación de servicios, integración de sistemas y participación en proyectos de modernización tecnológica."
          - "[Tercer cargo según certificado] | [Fecha de inicio] – [Fecha de finalización]"
          - "Responsabilidades: análisis, desarrollo, implementación y mantenimiento de sistemas de información."
          - "Participación en la modernización del Sistema Único de Modernización Aduanera (SUMA 2), orientada a una arquitectura de microservicios y despliegue sobre Kubernetes."
          - "Diseño e implementación de soluciones backend con Java 21, Spring Boot y NestJS, y frontend con Angular 19."
          - "Implementación y adopción de herramientas de infraestructura y observabilidad, incluyendo Kubernetes, GitLab CI/CD, Argo CD, HashiCorp Vault, ELK Stack y MinIO."
          - "Participación en la definición de estándares de desarrollo, arquitectura de software, integración continua y automatización de despliegues."

      - title: "Servicio de Impuestos Nacionales"
        sub: "Trayectoria profesional en desarrollo de sistemas y soluciones tributarias"
        location: "Bolivia"
        dates: "Marzo 2019 – Mayo 2023"
        bullets:
          - "Profesional F | Marzo 2022 – Mayo 2023"
          - "Desempeño como Scrum Master de equipo y desarrollador de soluciones backend con Java y Spring Boot."
          - "Implementación de microservicios para el proyecto Declaraciones Juradas V2."
          - "Integración de mecanismos de autenticación y autorización con Keycloak para aplicaciones backend Java y frontend Angular."
          - "Desarrollo de aplicaciones frontend con Angular 14 y servicios de integración."
          - "Integración de herramientas de documentación de APIs y análisis de calidad de código, incluyendo APIDOC y SonarQube."
          - "Profesional J | Abril 2021 – Marzo 2022"
          - "Desarrollo e implementación de funcionalidades del Sistema Integrado de la Administración Tributaria (SIAT en línea), en el módulo de Declaraciones Juradas."
          - "Diseño y desarrollo de servicios backend y APIs REST con .NET Core."
          - "Implementación de mecanismos de gestión de secretos con Vault e integración de registros y trazabilidad mediante ELK Stack."
          - "Desarrollo de interfaces web con Razor Pages y creación de librerías reutilizables para Java y .NET Core."
          - "Consultor Individual de Línea – Consultor I | Junio 2020 – Diciembre 2020"
          - "Desarrollo y pruebas de funcionalidades del sistema de facturación electrónica virtual."
          - "Implementación de servicios backend REST/SOAP e interfaces frontend con JSF y Angular."
          - "Desarrollo de aplicaciones de escritorio con JavaFX."
          - "Consultor Individual de Línea – Consultor J | Febrero 2020 – Junio 2020"
          - "Desarrollo full stack de funcionalidades del sistema de facturación electrónica SIAT."
          - "Implementación de servicios web REST/SOAP, aplicaciones de escritorio con JavaFX e interfaces con JSF y Angular."
          - "Técnico I – Desarrollador Java | Marzo 2019 – Diciembre 2019"
          - "Análisis, desarrollo y pruebas de sistemas de información del nuevo sistema integrado del SIN."
          - "Participación en los módulos de Estados Financieros, Facturación Electrónica, Hoteles y Agentes de Información."

